<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Sebastian Beingolea — Desarrollador de software, Lima, Peru">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#15110D"/>
      <stop offset="1" stop-color="#2A1A10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#7BB661"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7BB661" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7BB661" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="930" cy="160" r="240" fill="url(#glow)"/>

    <!-- grid -->
    <g stroke="#FFFFFF" stroke-opacity="0.04">
      <path d="M0 80H1200M0 160H1200M0 240H1200"/>
      <path d="M160 0V320M320 0V320M480 0V320M640 0V320M800 0V320M960 0V320M1120 0V320"/>
    </g>

    <!-- parcela georreferenciada -->
    <g transform="translate(790 60)">
      <polygon points="40,120 130,30 290,70 320,180 200,230 60,200"
               fill="#7BB661" fill-opacity="0.07"
               stroke="url(#accent)" stroke-width="2"
               stroke-dasharray="1100" stroke-dashoffset="1100">
        <animate attributeName="stroke-dashoffset" from="1100" to="0" dur="3.5s" fill="freeze"/>
      </polygon>
      <g fill="#C9A227">
        <circle cx="40"  cy="120" r="5"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="3.2s" repeatCount="indefinite"/></circle>
        <circle cx="130" cy="30"  r="5"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="3.4s" repeatCount="indefinite"/></circle>
        <circle cx="290" cy="70"  r="5"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="3.6s" repeatCount="indefinite"/></circle>
        <circle cx="320" cy="180" r="5"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="3.8s" repeatCount="indefinite"/></circle>
        <circle cx="200" cy="230" r="5"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="4.0s" repeatCount="indefinite"/></circle>
        <circle cx="60"  cy="200" r="5"><animate attributeName="r" values="5;8;5" dur="2.4s" begin="4.2s" repeatCount="indefinite"/></circle>
      </g>
      <circle r="6" fill="#FFFFFF" fill-opacity="0.9">
        <animateMotion dur="7s" repeatCount="indefinite"
          path="M40,120 L130,30 L290,70 L320,180 L200,230 L60,200 Z"/>
      </circle>
    </g>

    <!-- texto -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="118" fill="#FFFFFF" font-size="52" font-weight="700" letter-spacing="-1">Sebastian Beingolea</text>
      <rect x="72" y="140" width="64" height="4" rx="2" fill="url(#accent)"/>
      <text x="72" y="186" fill="#C9D1D9" font-size="23" font-weight="500">Desarrollador móvil y full-stack</text>
      <text x="72" y="222" fill="#8B949E" font-size="18">React Native · TypeScript · .NET</text>
      <g transform="translate(72 250)">
        <path d="M7 0C3.1 0 0 3.1 0 7c0 5.3 7 13 7 13s7-7.7 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 7 4.5a2.5 2.5 0 0 1 0 5z" fill="#7BB661"/>
        <text x="24" y="17" fill="#8B949E" font-size="16">Lima, Perú</text>
      </g>
    </g>

    <rect y="316" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
